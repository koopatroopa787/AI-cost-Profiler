[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cost-profiler"
version = "0.1.0"
description = "Lightweight SDK to instrument AI agent applications and track LLM costs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AI Cost Profiler Team"}
]
keywords = ["ai", "llm", "cost", "monitoring", "openai", "anthropic", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tiktoken>=0.5.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[project.scripts]
ai-cost = "ai_cost_profiler.cli:main"

[project.urls]
Homepage = "https://github.com/ai-cost-profiler/ai-cost-profiler"
Documentation = "https://github.com/ai-cost-profiler/ai-cost-profiler#readme"
Repository = "https://github.com/ai-cost-profiler/ai-cost-profiler"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_cost_profiler*", "dashboard*"]
